# =============================================================================
# calendar_times.yaml — godziny publikacji dla źródeł, które podają tylko DATĘ
# =============================================================================
#
# ADR-032: godzina zdarzenia musi pochodzić ze źródła oficjalnego. Gdy źródło
# daty (tu: FRED/ALFRED) jej nie podaje, godzina jest prerejestrowana TUTAJ,
# z adresem strony i cytatem, i potwierdzona ręcznie przez użytkownika
# (`verified: true`). Dopóki `verified: false`, `scripts/fetch_calendar.py`
# NIE generuje zdarzeń serii — raport pokrycia pokaże ją jako brakującą.
#
# Weryfikacja wymaga DWÓCH stron:
#   - bieżący harmonogram (godzina dziś),
#   - dowolna publikacja z 2016 r. (godzina na początku okresu testu).
# Jeśli godziny się różnią, seria potrzebuje przedziałów czasu — nie wpisywać
# jednej wartości.
#
# `proposed_by` mówi, skąd wzięła się propozycja. LLM nie jest źródłem.
#
# Nie są tu potrzebne serie ze źródłami podającymi godzinę KAŻDEJ publikacji:
#   US_PCE, US_GDP_ADVANCE — `bea` (nagłówek embarga); PCE 2016–2025:
#     107 × 8:30 ET, 10 × 10:00 lub 9:30 — stała godzina byłaby błędna,
#   US_CPI, US_NFP — `bls` (roczne kalendarze BLS); 119 + 119 × 8:30 ET.
# Plik zostaje jako ostatnia deska ratunku dla źródeł bez godzin.
# =============================================================================

fred_release_times:
  US_RETAIL_SALES:
    local_time: null                # do uzupełnienia z source
    timezone: "America/New_York"
    schedule_url: "https://www.census.gov/economic-indicators/"
    quote: null
    proposed_by: "do potwierdzenia — godzina nie znaleziona w treści strony"
    verified: false
